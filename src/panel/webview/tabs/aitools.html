<div id="tab-aitools" class="screen">
  <div class="scroll">
    <div id="aitools-alert"></div>

    <div class="section-hdr">Generate Documentation</div>
    <div class="card" style="margin-bottom:10px">
      <div class="card-body" style="margin-bottom:8px">Save AI-generated docs directly to your workspace.</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn btn-block" id="gen-readme-btn">Generate README</button>
        <button class="btn btn-block btn-secondary" id="gen-arch-btn">Generate ARCHITECTURE.md</button>
        <button class="btn btn-block btn-secondary" id="gen-onboarding-btn">Generate ONBOARDING.md</button>
      </div>
    </div>

    <div class="section-hdr">Refactor Analysis</div>
    <div class="card" style="margin-bottom:10px">
      <div class="card-body" style="margin-bottom:8px">
        Analyses coupling, god files, and architectural issues.
      </div>
      <button class="btn btn-block btn-secondary" id="refactor-btn">🔍 Analyze Code Quality</button>
      <div id="refactor-result" style="display:none;margin-top:10px">
        <div class="ai-tool-result-hdr">
          <span class="ai-tool-result-label">Analysis</span>
          <button class="btn btn-sm btn-secondary" id="save-refactor-btn">Save as REFACTOR.md</button>
        </div>
        <div class="ai-result-box" id="refactor-content"></div>
      </div>
    </div>

    <div class="section-hdr">PR / Diff Review</div>
    <div class="card">
      <div class="card-body" style="margin-bottom:6px">
        Paste a <code>git diff</code> and get a structured code review.
      </div>
      <textarea
        id="pr-diff-input"
        placeholder="Paste git diff output here..."
        style="min-height:80px;max-height:180px;resize:vertical;font-family:monospace;font-size:10.5px;margin-bottom:6px"
      ></textarea>
      <div style="display:flex;gap:6px">
        <button class="btn" id="review-pr-btn" style="flex:1">Review PR</button>
        <button class="btn btn-secondary" id="clear-pr-btn">Clear</button>
      </div>
      <div id="pr-result" style="display:none;margin-top:10px">
        <div class="ai-tool-result-hdr">
          <span class="ai-tool-result-label">Review</span>
          <button class="btn btn-sm btn-secondary" id="save-pr-btn">Save as PR-REVIEW.md</button>
        </div>
        <div class="ai-result-box" id="pr-content"></div>
      </div>
    </div>
  </div>
</div>
